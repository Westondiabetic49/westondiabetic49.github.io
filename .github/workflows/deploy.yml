name: Publish Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A56BFA: ${{ secrets.A56BFA }}
          B350A1: ${{ secrets.B350A1 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          k1 = os.environ.get('A56BFA', '')
          k2 = os.environ.get('B350A1', '')
          idx = pathlib.Path('index.html')
          txt = idx.read_text(encoding='utf-8')
          out = txt.replace('<!-- 3055987bb648efb58c32cbe2 -->', k1) if k1 else txt
          out = out.replace('<!-- 97c226ecf590068b19a87bb62de100550005e9d6d6 -->', k2) if k2 else out
          if out == txt and (k1 or k2):
              sys.exit(1)
          if out != txt:
              idx.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
